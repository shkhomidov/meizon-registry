{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-registryd
  labels:
    app.kubernetes.io/name: registryd
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  REGISTRYD_ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required" .Values.secrets.encryptionKey | quote }}
  REGISTRYD_AUTH_PASSWORD_PEPPER: {{ required "secrets.passwordPepper is required" .Values.secrets.passwordPepper | quote }}
  REGISTRYD_PG_PASSWORD: {{ required "secrets.pgPassword is required" .Values.secrets.pgPassword | quote }}
  REGISTRYD_ADMIN_TOKEN: {{ .Values.secrets.adminToken | quote }}
{{- end }}
