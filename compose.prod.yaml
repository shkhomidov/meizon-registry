#
# Minimum production footprint: registryd + PostgreSQL. A one-shot bootstrap
# service renders REGISTRYD_* env into a config file on a shared volume; the
# daemon then loads it. Front this with an HTTPS reverse proxy in production and
# supply secrets from your secret manager rather than inline env.

name: meizon-registry

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: registryd
      POSTGRES_PASSWORD: ${REGISTRYD_PG_PASSWORD:-registryd}
      POSTGRES_DB: registryd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registryd"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: hand the config volume to the image's nonroot user. Docker creates
  # a named volume owned by root, but the distroless image runs as nonroot
  # (65532) and the rendered config is 0600 — so without this, bootstrap cannot
  # write it and registryd could not read it back if it did.
  config-init:
    image: busybox:1.36
    command: ["sh", "-c", "chown 65532:65532 /etc/registryd && chmod 0700 /etc/registryd"]
    user: "0:0"
    volumes:
      - config:/etc/registryd

  # One-shot: render REGISTRYD_* env -> /etc/registryd/config.yml on the shared volume.
  bootstrap:
    depends_on:
      config-init:
        condition: service_completed_successfully
    # REGISTRYD_IMAGE points at a published image (e.g. a GHCR release tag) so
    # the server pulls rather than builds; unset, it falls back to building
    # locally from this checkout. See docs/DEPLOY-GITHUB.md.
    build: .
    image: ${REGISTRYD_IMAGE:-meizon-registryd:latest}
    entrypoint: ["/usr/local/bin/registryd-bootstrap", "-output", "/etc/registryd/config.yml"]
    environment: &registryd-env
      REGISTRYD_ENCRYPTION_KEY: ${REGISTRYD_ENCRYPTION_KEY:?set REGISTRYD_ENCRYPTION_KEY}
      REGISTRYD_AUTH_PASSWORD_PEPPER: ${REGISTRYD_AUTH_PASSWORD_PEPPER:?set REGISTRYD_AUTH_PASSWORD_PEPPER}
      # Signs console session cookies. Empty is not an error but silently
      # disables the console and its API, leaving only distribution — so it is
      # required here rather than defaulted.
      REGISTRYD_AUTH_COOKIE_SECRET: ${REGISTRYD_AUTH_COOKIE_SECRET:?set REGISTRYD_AUTH_COOKIE_SECRET}
      REGISTRYD_BASE_URL: ${REGISTRYD_BASE_URL:-http://localhost:8080}
      # Set true once a TLS-terminating proxy is in front. Without it the
      # session cookie is sent over plaintext.
      REGISTRYD_API_COOKIE_SECURE: ${REGISTRYD_API_COOKIE_SECURE:-false}
      REGISTRYD_SUPER_ADMINS: ${REGISTRYD_SUPER_ADMINS:-}
      REGISTRYD_ADMIN_TOKEN: ${REGISTRYD_ADMIN_TOKEN:-}
      REGISTRYD_PG_ADDR: postgres:5432
      REGISTRYD_PG_PASSWORD: ${REGISTRYD_PG_PASSWORD:-registryd}
      REGISTRYD_API_ADDR: 0.0.0.0:8080
      REGISTRYD_METRICS_ADDR: 0.0.0.0:8081
    volumes:
      - config:/etc/registryd

  registryd:
    build: .
    image: ${REGISTRYD_IMAGE:-meizon-registryd:latest}
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    command: ["-cfg-file", "/etc/registryd/config.yml"]
    environment: *registryd-env
    volumes:
      - config:/etc/registryd
    # Bound to loopback by default: the API expects a TLS-terminating proxy in
    # front, and the metrics endpoint is unauthenticated so publishing it on
    # 0.0.0.0 exposes it to the internet. Override REGISTRYD_BIND to 0.0.0.0
    # only when nothing is proxying.
    ports:
      - "${REGISTRYD_BIND:-127.0.0.1}:8080:8080" # API (front with HTTPS in production)
      - "${REGISTRYD_BIND:-127.0.0.1}:8081:8081" # metrics

volumes:
  pgdata:
  config:
